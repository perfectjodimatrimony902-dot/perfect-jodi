<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="pjGradient" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#8e142b" />
      <stop offset="65%" stop-color="#7c1024" />
      <stop offset="100%" stop-color="#550817" />
    </radialGradient>
    <filter id="pjShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Gold Rim -->
  <circle cx="256" cy="256" r="236" fill="url(#pjGradient)" stroke="#da9a45" stroke-width="20" filter="url(#pjShadow)" />
  
  <!-- Inner Subtle Accent Ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#e1a447" stroke-width="3" stroke-opacity="0.45" />
  
  <!-- Brand Text PJ -->
  <text 
    x="256" 
    y="326" 
    font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" 
    font-size="216" 
    font-weight="800" 
    fill="#e1a447" 
    text-anchor="middle" 
    letter-spacing="-4"
  >PJ</text>
</svg>
